<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table</title>
    <link rel="stylesheet" href="./Css/User-Table.css">
</head>
<body>
    <div class="User-table">
        <!-- Search input field -->
        <input type="text" id="searchInput" placeholder="Search for employees..." onkeyup="filterTable()">
        
        <!-- Employee table -->
        <table id="employeeTable">
            <thead>
                <tr>
                    <th>S.no</th>
                    <th>Employee Name</th>
                    <th>Technology</th>
                    <th>Experience</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // Fetch employee data from JSON
        fetch('./data.json') // Adjust the path if necessary
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                populateTable(data);
            })
            .catch(error => {
                console.error('Error loading employee data:', error);
            });

        // Function to populate the table with employee data
        function populateTable(data) {
            const tableBody = document.getElementById('employeeTable').getElementsByTagName('tbody')[0];

            data.forEach((employee, index) => {
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${employee['Employee Name']}</td>
                    <td>${employee['Technology'] || 'N/A'}</td>
                    <td>${employee['Experience'] || 'N/A'}</td>
                `;
            });
        }

        // Function for search functionality
        function filterTable() {
            let input = document.getElementById('searchInput');
            let filter = input.value.toUpperCase();
            let table = document.getElementById('employeeTable');
            let tr = table.getElementsByTagName('tr');

            // Loop through all table rows and hide those that don't match the search query
            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName('td');
                let match = false;

                // Check each column (name, technology, experience) in the row
                for (let j = 1; j < td.length; j++) {
                    if (td[j].textContent.toUpperCase().indexOf(filter) > -1) {
                        match = true;
                        break;
                    }
                }

                // Hide or show the row based on the match
                if (match) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
